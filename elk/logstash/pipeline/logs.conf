# Weave — container logs from Filebeat. Kept 7 days by ILM (scripts/setup-elk.sh).

input {
  beats { port => 5044 }
}

filter {
  mutate { remove_field => ["@version"] }
}

output {
  elasticsearch {
    hosts => ["${ES_URL}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    ssl_certificate_authorities => ["${ES_CA}"]
    index => "weave-logs-%{+YYYY.MM.dd}"
    data_stream => false
    manage_template => false
    ilm_enabled => false
  }
}
