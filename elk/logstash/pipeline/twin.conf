# Weave — mirror twin.* from Postgres into Elasticsearch for Kibana.
#
# Postgres is the system of record. This is a read copy, bounded to the last
# 7 days: ILM deletes each daily index at 7 days, and every query is floored
# at the same window, so a first start (or a wiped logstash-data volume)
# against months of history never backfills more than ILM would keep.
#
# Polls overlap on purpose. Flink's JDBC sinks flush in batches, so a row can
# commit after a later-stamped row was already read; re-reading the last few
# minutes catches it. That re-read is only safe because every document id is
# the row's natural key, so a second read overwrites instead of duplicating,
# and index names come from the row's own timestamp, so it overwrites in the
# same daily index.
#
# is_synthetic is carried wherever the table has it. Derived tables
# (dma_balance, sim_residual, dma_latest) are built from synthetic meters and
# loggers, so they are stamped true here in the same way the Flink pipelines
# hardcode the flag per source.

input {
  # ------------------------------------------------------ REAL: water
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_hydrometry"
    statement => "
      SELECT concat_ws('|', site_id, variable, (extract(epoch FROM ts) * 1000000)::bigint) AS doc_id,
             ts, site_id, variable, value, quality_code, provider, is_synthetic
      FROM twin.hydrometry
      WHERE ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY ts"
    add_field => { "[@metadata][table]" => "hydrometry" }
  }

  # ------------------------------------------------ REAL: electricity
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_market_dispatch"
    statement => "
      SELECT concat_ws('|', region_id, (extract(epoch FROM ts) * 1000000)::bigint) AS doc_id,
             ts, region_id, price_mwh, total_demand_mw, net_interchange_mw,
             scheduled_generation_mw, semi_scheduled_generation_mw, is_synthetic
      FROM twin.market_dispatch
      WHERE ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY ts"
    add_field => { "[@metadata][table]" => "market-dispatch" }
  }

  # ------------------------------------------ SYNTHETIC: water meters
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_meter_reading"
    statement => "
      SELECT concat_ws('|', meter_id, (extract(epoch FROM ts) * 1000000)::bigint) AS doc_id,
             ts, meter_id, dma_id, litres, flow_lpm, battery_pct, is_synthetic
      FROM twin.meter_reading
      WHERE ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY ts"
    add_field => { "[@metadata][table]" => "meter-reading" }
  }

  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_pressure_reading"
    statement => "
      SELECT concat_ws('|', logger_id, (extract(epoch FROM ts) * 1000000)::bigint) AS doc_id,
             ts, logger_id, dma_id, pressure_m, flow_ls, is_synthetic
      FROM twin.pressure_reading
      WHERE ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY ts"
    add_field => { "[@metadata][table]" => "pressure-reading" }
  }

  # ------------------------------------ SYNTHETIC: electricity meters
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_electricity_interval"
    statement => "
      SELECT concat_ws('|', meter_id, (extract(epoch FROM ts) * 1000000)::bigint) AS doc_id,
             ts, meter_id, substation_id, kwh_import, kwh_export, voltage_v, is_synthetic
      FROM twin.electricity_interval
      WHERE ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY ts"
    add_field => { "[@metadata][table]" => "electricity-interval" }
  }

  # ------------------------------------------------ GOLD: DMA balance
  # A window lands in Postgres ~15 minutes after its window_start, and the
  # meter/pressure join can upsert it again when the pressure side arrives,
  # so the overlap here is an hour rather than minutes.
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "window_start"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_dma_balance"
    statement => "
      SELECT concat_ws('|', dma_id, (extract(epoch FROM window_start) * 1000000)::bigint) AS doc_id,
             window_start, dma_id, inflow_l, consumption_l, loss_l, loss_pct,
             min_pressure_m, meter_count, true AS is_synthetic
      FROM twin.dma_balance
      WHERE window_start > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                           - interval '1 hour'
      ORDER BY window_start"
    add_field => { "[@metadata][table]" => "dma-balance" }
  }

  # ------------------------------------------- MODEL: residuals + state
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_sim_residual"
    statement => "
      SELECT concat_ws('|', dma_id, element_id, variable, (extract(epoch FROM ts) * 1000000)::bigint) AS doc_id,
             ts, dma_id, element_id, variable, modelled, observed, residual,
             z_score, flagged, true AS is_synthetic
      FROM twin.sim_residual
      WHERE ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY ts"
    add_field => { "[@metadata][table]" => "sim-residual" }
  }

  # Current state per DMA, upserted in place by run_sim.py. Small enough to
  # re-read whole every minute; joined to its polygon (WKT, which a geo_shape
  # field accepts directly) so Kibana Maps can colour DMAs by status.
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    schedule => "0 * * * * *"
    record_last_run => false
    statement => "
      SELECT l.dma_id AS doc_id, l.dma_id, l.ts, l.inflow_l, l.consumption_l,
             l.loss_pct, l.min_pressure_m, l.status, d.name AS dma_name,
             ST_AsText(d.geom) AS geom, true AS is_synthetic
      FROM twin.dma_latest l
      LEFT JOIN asset.dma d USING (dma_id)"
    add_field => { "[@metadata][table]" => "dma-latest" }
  }
}

filter {
  # @timestamp is the row's own time, not the poll time, so a re-read row
  # resolves to the same daily index as its first read.
  ruby {
    code => "t = event.get('ts') || event.get('window_start'); event.set('@timestamp', t) if t"
  }
  mutate {
    rename => { "doc_id" => "[@metadata][doc_id]" }
    remove_field => ["@version"]
  }
}

output {
  # Templates and ILM come from scripts/setup-elk.sh, not from Logstash.
  # Credentials are empty for the local cluster, which has security off; the
  # CA only takes effect for an https URL.
  if [@metadata][table] == "dma-latest" {
    elasticsearch {
      hosts => ["${ES_URL}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      ssl_certificate_authorities => ["${ES_CA}"]
      index => "twin-dma-latest"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["${ES_URL}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      ssl_certificate_authorities => ["${ES_CA}"]
      index => "twin-%{[@metadata][table]}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  }
}
