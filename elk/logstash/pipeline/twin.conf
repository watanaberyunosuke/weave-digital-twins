# Weave — mirror twin.* from Postgres into Elasticsearch for Kibana.
#
# Postgres is the system of record. This is a read copy, bounded to the last
# 7 days: ILM deletes each daily index at 7 days, and every query is floored
# at the same window, so a first start (or a wiped logstash-data volume)
# against months of history never backfills more than ILM would keep.
#
# Polls overlap on purpose. Flink's JDBC sinks flush in batches, so a row can
# commit after a later-stamped row was already read; re-reading the last few
# minutes catches it. That re-read is only safe because every document id is
# the row's natural key, so a second read overwrites instead of duplicating,
# and index names come from the row's own timestamp, so it overwrites in the
# same daily index.
#
# is_synthetic is carried wherever the table has it. Derived tables
# (dma_balance, sim_residual, dma_latest) are built from synthetic meters and
# loggers, so they are stamped true here in the same way the Flink pipelines
# hardcode the flag per source.
#
# Every input pages (20,000 rows). After an outage a forward input resumes from
# its saved position and a fill input reads the whole filled range, which can
# be hundreds of thousands of rows; read as one result set that exhausted the
# heap and left Logstash restarting. The saved position advances only after
# the last page, and each statement's ORDER BY keeps the pages stable.

input {
  # ------------------------------------------------------ REAL: water
  # Read forward on ingest_ts, not event_ts: a portal's hourly means arrive a day
  # late and a poller back from an outage fetches days at once, all dated
  # before rows already read. The 7-day floor still applies to event_ts.
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ingest_ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_hydrometry_ingested"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', site_id, variable, (extract(epoch FROM event_ts) * 1000000)::bigint) AS doc_id,
             event_ts, site_id, variable, value, quality_code, provider, is_synthetic, ingest_ts
      FROM twin.hydrometry
      WHERE ingest_ts > CAST(:sql_last_value AS timestamptz) - interval '5 minutes'
        AND event_ts > now() - interval '7 days'
      ORDER BY ingest_ts, site_id, variable, event_ts"
    add_field => { "[@metadata][table]" => "hydrometry" }
  }

  # ------------------------------------------ SYNTHETIC: water meters
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "event_ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_meter_reading"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', meter_id, (extract(epoch FROM event_ts) * 1000000)::bigint) AS doc_id,
             event_ts, meter_id, dma_id, litres, flow_lpm, battery_pct, is_synthetic, ingest_ts
      FROM twin.meter_reading
      WHERE event_ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY event_ts"
    add_field => { "[@metadata][table]" => "meter-reading" }
  }

  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "event_ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_pressure_reading"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', logger_id, (extract(epoch FROM event_ts) * 1000000)::bigint) AS doc_id,
             event_ts, logger_id, dma_id, pressure_m, flow_ls, is_synthetic, ingest_ts
      FROM twin.pressure_reading
      WHERE event_ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY event_ts"
    add_field => { "[@metadata][table]" => "pressure-reading" }
  }

  # ------------------------------------------------ GOLD: DMA balance
  # A window lands in Postgres ~15 minutes after its window_start, and the
  # meter/pressure join can upsert it again when the pressure side arrives,
  # so the overlap here is an hour rather than minutes.
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "window_start"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_dma_balance"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', dma_id, (extract(epoch FROM window_start) * 1000000)::bigint) AS doc_id,
             window_start, dma_id, inflow_l, consumption_l, loss_l, loss_pct,
             min_pressure_m, meter_count, true AS is_synthetic
      FROM twin.dma_balance
      WHERE window_start > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                           - interval '1 hour'
      ORDER BY window_start"
    add_field => { "[@metadata][table]" => "dma-balance" }
  }

  # ------------------------------------------------- SYNTHETIC: gap fills
  # ingest/backfill.py writes rows older than the positions above, which only
  # read forward, so these read each fill once by when it was logged. Fills are
  # logged one at a time by one writer, so these need no overlap, and a large fill
  # shouldn't be re-sent every 15 seconds. Natural-key ids make any re-read safe.
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "filled_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_backfill_meter"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', r.meter_id, (extract(epoch FROM r.event_ts) * 1000000)::bigint) AS doc_id,
             r.event_ts, r.meter_id, r.dma_id, r.litres, r.flow_lpm, r.battery_pct, r.is_synthetic, r.ingest_ts,
             b.filled_at
      FROM twin.backfill_log b
      JOIN twin.meter_reading r ON r.event_ts BETWEEN b.gap_start AND b.gap_end
      WHERE b.stream = 'meter_reading' AND b.filled_at > :sql_last_value
        AND r.event_ts > now() - interval '7 days'
      ORDER BY b.filled_at"
    add_field => { "[@metadata][table]" => "meter-reading" }
  }

  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "filled_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_backfill_pressure"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', r.logger_id, (extract(epoch FROM r.event_ts) * 1000000)::bigint) AS doc_id,
             r.event_ts, r.logger_id, r.dma_id, r.pressure_m, r.flow_ls, r.is_synthetic, r.ingest_ts,
             b.filled_at
      FROM twin.backfill_log b
      JOIN twin.pressure_reading r ON r.event_ts BETWEEN b.gap_start AND b.gap_end
      WHERE b.stream = 'pressure_reading' AND b.filled_at > :sql_last_value
        AND r.event_ts > now() - interval '7 days'
      ORDER BY b.filled_at"
    add_field => { "[@metadata][table]" => "pressure-reading" }
  }

  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "filled_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_backfill_dma_balance"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', d.dma_id, (extract(epoch FROM d.window_start) * 1000000)::bigint) AS doc_id,
             d.window_start, d.dma_id, d.inflow_l, d.consumption_l, d.loss_l, d.loss_pct,
             d.min_pressure_m, d.meter_count, true AS is_synthetic, b.filled_at
      FROM twin.backfill_log b
      JOIN twin.dma_balance d ON d.window_start >= b.gap_start - interval '15 minutes'
                             AND d.window_start <= b.gap_end
      WHERE b.stream IN ('meter_reading', 'pressure_reading') AND b.filled_at > :sql_last_value
        AND d.window_start > now() - interval '7 days'
      ORDER BY b.filled_at"
    add_field => { "[@metadata][table]" => "dma-balance" }
  }

  # Residuals run_sim.py replayed after an outage carry their own past ts,
  # so the forward-reading input above never sees them; this reads each
  # replayed range once, on filled_at, with the same doc_id.
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "filled_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_backfill_sim_residual"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', r.dma_id, r.element_id, r.variable, (extract(epoch FROM r.ts) * 1000000)::bigint) AS doc_id,
             r.ts, r.dma_id, r.element_id, r.variable, r.modelled, r.observed, r.residual,
             r.z_score, r.flagged, true AS is_synthetic, b.filled_at
      FROM twin.backfill_log b
      JOIN twin.sim_residual r ON r.ts BETWEEN b.gap_start AND b.gap_end
      WHERE b.stream = 'sim_residual' AND b.filled_at > :sql_last_value
        AND r.ts > now() - interval '7 days'
      ORDER BY b.filled_at"
    add_field => { "[@metadata][table]" => "sim-residual" }
  }

  # ------------------------------------------- MODEL: residuals + state
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_fetch_size => 5000
    schedule => "*/15 * * * * *"
    use_column_value => true
    tracking_column => "ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/jdbc_last_run_sim_residual"
    jdbc_paging_enabled => true
    jdbc_page_size => 20000
    statement => "
      SELECT concat_ws('|', dma_id, element_id, variable, (extract(epoch FROM ts) * 1000000)::bigint) AS doc_id,
             ts, dma_id, element_id, variable, modelled, observed, residual,
             z_score, flagged, true AS is_synthetic
      FROM twin.sim_residual
      WHERE ts > greatest(CAST(:sql_last_value AS timestamptz), now() - interval '7 days')
                 - interval '5 minutes'
      ORDER BY ts"
    add_field => { "[@metadata][table]" => "sim-residual" }
  }

  # Current state per DMA, upserted in place by run_sim.py. Small enough to
  # re-read whole every minute; joined to its polygon (WKT, which a geo_shape
  # field accepts directly) so Kibana Maps can colour DMAs by status.
  jdbc {
    jdbc_connection_string => "${TWIN_JDBC_URL}"
    jdbc_user => "${TWIN_DB_USER}"
    jdbc_password => "${TWIN_DB_PASSWORD}"
    jdbc_driver_class => "org.postgresql.Driver"
    schedule => "0 * * * * *"
    record_last_run => false
    statement => "
      SELECT l.dma_id AS doc_id, l.dma_id, l.ts, l.inflow_l, l.consumption_l,
             l.loss_pct, l.min_pressure_m, l.status, d.name AS dma_name,
             ST_AsText(d.geom) AS geom, true AS is_synthetic
      FROM twin.dma_latest l
      LEFT JOIN asset.dma d USING (dma_id)"
    add_field => { "[@metadata][table]" => "dma-latest" }
  }
}

filter {
  # @timestamp is the row's own time, not the poll time, so a re-read row
  # resolves to the same daily index as its first read.
  ruby {
    code => "t = event.get('event_ts') || event.get('ts') || event.get('window_start'); event.set('@timestamp', t) if t"
  }
  mutate {
    rename => { "doc_id" => "[@metadata][doc_id]" }
    remove_field => ["@version", "filled_at"]
  }
}

output {
  # Templates and ILM come from scripts/setup-elk.sh, not from Logstash.
  # Credentials are empty for the local cluster, which has security off; the
  # CA only takes effect for an https URL.
  if [@metadata][table] == "dma-latest" {
    elasticsearch {
      hosts => ["${ES_URL}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      ssl_certificate_authorities => ["${ES_CA}"]
      index => "twin-dma-latest"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["${ES_URL}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      ssl_certificate_authorities => ["${ES_CA}"]
      index => "twin-%{[@metadata][table]}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  }
}
