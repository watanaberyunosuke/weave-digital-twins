# Weave — layered onto Confluent's cp-all-in-one compose file, which
# scripts/fetch-confluent-stack.sh puts in the repository root (git-ignored).
# Region settings come from .env (see .env.example); nothing here names a place.

# Pinned so volume, network and image names don't follow whatever the
# directory is called; renaming it would otherwise orphan pgdata.
name: weave

# Every service logs as json-file: Filebeat reads Docker's JSON log files,
# and an engine whose default driver is `local` writes a binary format it
# can't parse. Rotation caps each container at 30 MB, since Filebeat ships
# the lines and Docker Desktop's disk is shared with every image.
x-logging: &json-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:

  # Upstream services, listed to set their logging and to publish their
  # ports on loopback only. None of them asks for credentials, so on every
  # interface anyone on the same network could manage topics, connectors
  # and Flink jobs. `!override` replaces upstream's port list (a plain
  # `ports:` here would add a binding beside the open one) and needs
  # Docker Compose 2.24.4 or later. Reach them from another machine
  # through an SSH tunnel rather than reopening them.
  broker:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9101:9101"
  schema-registry:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:8081:8081"
  ksqldb-server:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:8088:8088"
  rest-proxy:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:8082:8082"
  # Control Center manages the broker, topics, Connect and Schema Registry;
  # Prometheus and Alertmanager back its metrics and alerts. Flink is not
  # visible in it (that needs Confluent Manager for Apache Flink), so the
  # Flink UI on :9081 stays the place to manage jobs.
  control-center:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:9021:9021"
  prometheus:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:9090:9090"
  alertmanager:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:9093:9093"

  connect:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:8083:8083"
    volumes:
      - ./schemas:/schemas:ro

  flink-jobmanager:
    logging: *json-logs
    ports: !override
      - "127.0.0.1:9081:9081"
    volumes:
      - ./flink/lib:/opt/flink/lib/weave:ro
      - ./flink/sql:/sql:ro

  flink-taskmanager:
    logging: *json-logs
    volumes:
      - ./flink/lib:/opt/flink/lib/weave:ro

  # A `docker exec` target that only idles; see the console for why init.
  flink-sql-client:
    logging: *json-logs
    init: true
    volumes:
      - ./flink/lib:/opt/flink/lib/weave:ro
      - ./flink/sql:/sql:ro

  # --- asset graph + telemetry store: PostGIS, pgRouting, TimescaleDB -------
  postgres:
    logging: *json-logs
    image: timescale/timescaledb-ha:pg16
    # Not "postgres": that name is commonly taken by a stock postgres
    # container, which can't host this schema (no PostGIS, pgRouting or
    # TimescaleDB). Other services reach this one by hostname, not by name.
    container_name: weave-postgres
    hostname: postgres
    # Loopback like everything else: desktop GIS and psql on this machine
    # still reach it, and the default password never faces the network.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: weave_twin
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave_twin"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- real feed: wholesale electricity market dispatch ----------------------
  ingest-market:
    logging: *json-logs
    build: ./ingest
    container_name: ingest-market
    init: true
    command: python market_poller.py
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      MARKET_DISPATCH_URL: ${MARKET_DISPATCH_URL}
      MARKET_REGION: ${MARKET_REGION}
      MARKET_INTERVAL_S: ${MARKET_INTERVAL_S:-300}
    restart: unless-stopped

  # --- real feed: public water gauge telemetry ------------------------------
  ingest-hydrometry:
    logging: *json-logs
    build: ./ingest
    container_name: ingest-hydrometry
    init: true
    command: python hydrometry_poller.py
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      HYDRO_URL: ${HYDRO_URL}
      HYDRO_PROVIDER: ${HYDRO_PROVIDER:-hydrometry}
      HYDRO_SITES: ${HYDRO_SITES}
      HYDRO_INTERVAL_S: ${HYDRO_INTERVAL_S:-900}
    restart: unless-stopped

  # --- batch: public GIS network loader (run on demand) ---------------------
  gis-loader:
    logging: *json-logs
    build: ./ingest
    container_name: gis-loader
    init: true
    working_dir: /work
    command: ["sleep", "infinity"]
    environment:
      TWIN_DSN: postgresql://weave:weave@postgres:5432/weave_twin
      GIS_REGION_CONFIG: ${GIS_REGION_CONFIG}
      SCHEMA_NAMESPACE: ${SCHEMA_NAMESPACE:-weave}
      # The seeder places DMAs on the pipes the model keeps, so it reads the
      # same cap and snap distance as the simulator.
      SIM_MAX_PIPES: ${SIM_MAX_PIPES:-10000}
      SIM_MAX_SNAP_M: ${SIM_MAX_SNAP_M:-500}
    volumes:
      - ./gis:/work/gis:ro
      - ./scripts:/work/scripts:ro
      - ./model:/work/model:ro
      - ./schemas:/work/schemas
    depends_on:
      postgres:
        condition: service_healthy

  # --- hydraulic simulation: EPANET via WNTR --------------------------------
  simulator:
    logging: *json-logs
    build: ./model
    # WNTR bundles EPANET for linux-x64 only, so on ARM hosts (Apple Silicon)
    # the solver can't load natively; amd64 runs under emulation there.
    platform: linux/amd64
    container_name: simulator
    init: true
    environment:
      TWIN_DSN: postgresql://weave:weave@postgres:5432/weave_twin
      SIM_INTERVAL_S: "900"
      SIM_MAX_PIPES: ${SIM_MAX_PIPES:-10000}
      SIM_RESERVOIR_DEPTH_M: "10"
      SIM_MAX_SNAP_M: ${SIM_MAX_SNAP_M:-500}
      SIM_RESIDUAL_MIN_SAMPLES: ${SIM_RESIDUAL_MIN_SAMPLES:-8}
    volumes:
      - siminp:/app/out
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- console: one page to see the twin and run the bootstrap steps --------
  # Reads Postgres, Connect, Flink and Kafka; operates only by running the
  # documented scripts and `docker exec` commands. That takes the Docker
  # socket, which is root on the host, so the port binds to loopback only.
  # init: the scripts it runs leave orphans that uvicorn, as PID 1, never
  # reaps. A zombie makes `docker stop` fail and leaves Docker Desktop holding
  # the stack's ports, so the next start hangs. The Python and `sleep` services
  # get init too: as PID 1 they ignore SIGTERM and are only killed at the
  # 10 s timeout.
  console:
    logging: *json-logs
    build: ./console
    container_name: weave-console
    init: true
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8090}:8090"
    environment:
      TWIN_DSN: postgresql://weave:weave@postgres:5432/weave_twin
      GIS_REGION_CONFIG: ${GIS_REGION_CONFIG}
      KAFKA_BOOTSTRAP: broker:29092
      CONNECT_URL: http://connect:8083
      FLINK_URL: ${FLINK_URL:-http://flink-jobmanager:9081}
      KIBANA_PUBLIC_URL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
      FLINK_PUBLIC_URL: ${FLINK_PUBLIC_URL:-http://localhost:9081}
      CONTROL_CENTER_PUBLIC_URL: ${CONTROL_CENTER_PUBLIC_URL:-http://localhost:9021}
      CONSOLE_TILE_URL: ${CONSOLE_TILE_URL:-}
      CONSOLE_TILE_ATTRIBUTION: ${CONSOLE_TILE_ATTRIBUTION:-}
      CONSOLE_TILE_STYLE: ${CONSOLE_TILE_STYLE:-auto}
      CONSOLE_BASEMAP: ${CONSOLE_BASEMAP:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_REGION: ${GOOGLE_MAPS_REGION:-}
      GOOGLE_MAPS_LANGUAGE: ${GOOGLE_MAPS_LANGUAGE:-en}
      FEATURESERV_URL: http://featureserv:9000
      FEATURESERV_PUBLIC_URL: ${FEATURESERV_PUBLIC_URL:-http://localhost:9000}
      # The DMA panel explains the simulator's scoring, so it reads the same minimum.
      SIM_RESIDUAL_MIN_SAMPLES: ${SIM_RESIDUAL_MIN_SAMPLES:-8}
      # "console" lets the public console reach the relay routes by service name.
      CONSOLE_ALLOWED_HOSTS: ${CONSOLE_ALLOWED_HOSTS:-localhost,127.0.0.1,console}
      CONSOLE_RELAY_TOKEN: ${CONSOLE_RELAY_TOKEN:-}
      CONSOLE_RELAY_ADMIN_TOKEN: ${CONSOLE_RELAY_ADMIN_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/weave/scripts:ro
      - ./connectors:/weave/connectors:ro
      - ./schemas:/weave/schemas:ro
      - ./gis/regions:/weave/gis/regions:ro
      - siminp:/sim:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- public console: the same page, read-only, for anyone ------------------
  # Opt-in (profile "public"). No Docker socket and the read-only database
  # role: it can show the twin but never change it. Its demo login is open
  # (password "demo", shown on the form): it simulates every action except
  # the safe ones, which it relays to the admin console above. Hosted, this runs on another
  # machine with CONSOLE_RELAY_URL pointing back over a private link.
  console-public:
    profiles: ["public"]
    logging: *json-logs
    build: ./console
    container_name: weave-console-public
    init: true
    ports:
      - "127.0.0.1:${CONSOLE_PUBLIC_PORT:-8091}:8090"
    environment:
      CONSOLE_MODE: public
      SIM_RESIDUAL_MIN_SAMPLES: ${SIM_RESIDUAL_MIN_SAMPLES:-8}
      TWIN_DSN: postgresql://weave_reader:weave_reader@postgres:5432/weave_twin
      GIS_REGION_CONFIG: ${GIS_REGION_CONFIG}
      CONSOLE_ALLOWED_HOSTS: ${CONSOLE_PUBLIC_HOSTS:-localhost,127.0.0.1}
      CONSOLE_DEMO: ${CONSOLE_DEMO:-1}
      CONSOLE_DEMO_PASSWORD: ${CONSOLE_DEMO_PASSWORD:-demo}
      CONSOLE_COOKIE_SECURE: ${CONSOLE_COOKIE_SECURE:-0}
      CONSOLE_RELAY_URL: ${CONSOLE_RELAY_URL:-http://console:8090}
      CONSOLE_RELAY_TOKEN: ${CONSOLE_RELAY_TOKEN:-}
      CONSOLE_RELAY_ADMIN_TOKEN: ${CONSOLE_RELAY_ADMIN_TOKEN:-}
      CONSOLE_ADMIN_PASSWORD_HASH: ${CONSOLE_ADMIN_PASSWORD_HASH:-}
      CONSOLE_ADMIN_TOTP_SECRET: ${CONSOLE_ADMIN_TOTP_SECRET:-}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:-}
      CONSOLE_TILE_URL: ${CONSOLE_TILE_URL:-}
      CONSOLE_TILE_ATTRIBUTION: ${CONSOLE_TILE_ATTRIBUTION:-}
      CONSOLE_TILE_STYLE: ${CONSOLE_TILE_STYLE:-auto}
      CONSOLE_BASEMAP: ${CONSOLE_BASEMAP:-}
    volumes:
      - ./gis/regions:/weave/gis/regions:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- OGC API Features: the twin's layers for QGIS, ArcGIS Pro, GDAL --------
  # Publishes every spatial table the read-only role can see. Loopback only,
  # like the console: in aggregate the layers describe a real network.
  featureserv:
    logging: *json-logs
    image: pramsey/pg_featureserv:20250917
    container_name: featureserv
    ports:
      - "127.0.0.1:${FEATURESERV_PORT:-9000}:9000"
    environment:
      DATABASE_URL: postgresql://weave_reader:weave_reader@postgres:5432/weave_twin
      PGFS_SERVER_URLBASE: ${FEATURESERV_PUBLIC_URL:-http://localhost:9000}
      PGFS_PAGING_LIMITDEFAULT: "1000"
      PGFS_PAGING_LIMITMAX: "50000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- ELK: a disposable 7-day read copy of twin.*, plus container logs -----
  # Postgres stays the system of record; Logstash mirrors it into
  # Elasticsearch because Kibana cannot query Postgres. All Elastic images
  # share one version.
  #
  # An existing cluster is used when one answers at ELASTICSEARCH_URL (.env);
  # otherwise the local-elk profile below starts one. scripts/elk-up.sh makes
  # that choice — bring ELK up through it, not with a bare compose up.
  #
  # The local cluster runs without security, so its ports bind to loopback
  # only — both indices identify the region.
  elasticsearch:
    logging: *json-logs
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: elasticsearch
    profiles: ["local-elk"]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      # Absolute rather than percentage watermarks. On Docker Desktop the data
      # path is the whole shared VM disk, which is routinely >90% used by
      # images, and the default 90% high watermark then refuses to allocate
      # any shard at all. The copy is capped at 7 days, so free space is the
      # thing worth guarding.
      cluster.routing.allocation.disk.watermark.low: 2gb
      cluster.routing.allocation.disk.watermark.high: 1500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 1gb
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    logging: *json-logs
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: kibana
    profiles: ["local-elk"]
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
    depends_on:
      elasticsearch:
        condition: service_healthy

  # One-shot: ILM, index templates and Kibana data views must exist before
  # Logstash writes, or the first documents fix the mappings by guesswork.
  # Elasticsearch defaults to the local-elk service; Kibana has no default,
  # because an existing cluster may have none (scripts/elk-up.sh sets it for
  # the local one). An empty ELASTICSEARCH_CA means curl's own trust store.
  elk-setup:
    logging: *json-logs
    image: curlimages/curl:8.16.0
    container_name: elk-setup
    command: ["sh", "/work/scripts/setup-elk.sh"]
    environment:
      ES_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      KIBANA_URL: ${KIBANA_URL:-}
      ES_USER: ${ELASTICSEARCH_USERNAME:-}
      ES_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ES_CA: ${ELASTICSEARCH_CA:+/certs/${ELASTICSEARCH_CA}}
    volumes:
      - ./scripts:/work/scripts:ro
      - ./elk/certs:/certs:ro
    networks: [default, elk]
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
        required: false
      kibana:
        condition: service_healthy
        required: false

  logstash:
    logging: *json-logs
    build: ./elk/logstash
    container_name: logstash
    environment:
      TWIN_JDBC_URL: jdbc:postgresql://postgres:5432/weave_twin
      TWIN_DB_USER: weave
      TWIN_DB_PASSWORD: weave
      ES_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ES_USER: ${ELASTICSEARCH_USERNAME:-}
      ES_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      # The output validates this path even for plain http, where it is
      # ignored, so it falls back to the system trust store rather than empty.
      ES_CA: ${ELASTICSEARCH_CA:+/certs/}${ELASTICSEARCH_CA:-/etc/pki/tls/certs/ca-bundle.crt}
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./elk/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/certs:/certs:ro
      - logstash-data:/usr/share/logstash/data
    networks: [default, elk]
    depends_on:
      postgres:
        condition: service_healthy
      elk-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  filebeat:
    logging: *json-logs
    image: docker.elastic.co/beats/filebeat:9.5.4
    container_name: filebeat
    user: root
    # The config is bind-mounted from the host, so its ownership can't satisfy
    # Filebeat's permission check.
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - logstash
    restart: unless-stopped

networks:
  # The network an existing cluster lives on, joined (never created or
  # removed) so its TLS certificate's hostname resolves as issued. With no
  # existing cluster it is just a network of Weave's own.
  elk:
    name: ${ELK_NETWORK:-weave-elk}

volumes:
  pgdata:
  siminp:
  esdata:
  logstash-data:
  filebeat-data:
