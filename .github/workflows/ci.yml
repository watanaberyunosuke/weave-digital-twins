# Checks every PR and every push to main, then merges Dependabot patch
# updates that pass. Minor and major updates stay open for review.
#
# Each component is installed on Python 3.12, the base of its Docker image,
# so a dependency bump that breaks an import fails here rather than at
# container start (setuptools 83 did, HDH-134).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m py_compile gis/*.py ingest/*.py scripts/seed_synthetic_network.py model/*.py console/*.py
      - run: bash -n scripts/*.sh
      - run: node --check console/static/app.js

  # Each requirements.txt is compiled from its requirements.in. Recompiling
  # keeps existing pins, so any diff means an input changed without its lock.
  locks:
    name: Locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - run: pip install --require-hashes --only-binary ":all:" -r .github/ci/requirements.txt
      - run: scripts/lock-requirements.sh
      - run: git diff --exit-code -- '*requirements.txt'

  component:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [model, ingest, console]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.txt
      # Wheels only, so a bumped package can't run its own setup script in a
      # job that feeds the merge. Every current dependency ships a wheel; a
      # bump to one that doesn't fails here and waits for review. Hashes
      # pin every transitive package too, so this job tests exactly what the
      # image installs.
      - run: pip install --require-hashes --only-binary ":all:" -r requirements.txt
      # The EPANET test skips when wntr can't be imported, so import it
      # explicitly: a broken wntr must fail the build, not skip a test.
      - if: matrix.component == 'model'
        run: |
          python -c "import wntr, run_sim"
          python -m unittest discover -s . -p 'test_*.py'
      - if: matrix.component == 'ingest'
        # gis/ runs in the ingest image, so its decoder is checked here too.
        run: |
          python -c "import common, hydrometry_poller, market_poller"
          # The seeder runs in this image and shares the model's pipe selection.
          python -c "import sys; sys.path.insert(0, '../scripts'); import seed_synthetic_network"
          python -c "import imagecodecs, numpy; imagecodecs.lerc_decode"
      # The loader's conforming happens in PostGIS, so its fixtures run against
      # the image the stack's postgres service uses. It is started here rather
      # than as a job service so the other components don't pull it, and the
      # readiness check goes over TCP because the image's first-boot server
      # answers on its socket before initialisation finishes.
      - if: matrix.component == 'ingest'
        env:
          WEAVE_TEST_DSN: postgresql://postgres:weave@localhost:5432/postgres
        run: |
          docker run -d --name postgis -p 5432:5432 -e POSTGRES_PASSWORD=weave \
            timescale/timescaledb-ha:pg16
          timeout 180 sh -c 'until docker exec postgis pg_isready -h 127.0.0.1 -U postgres; do sleep 2; done'
          python -m unittest discover -s ../gis -p 'test_*.py' -v
      - if: matrix.component == 'console'
        run: |
          python -c "import app"
          python -m unittest discover -p 'test_*.py' -v

  dependabot-merge:
    name: Merge Dependabot patch update
    needs: [syntax, component]
    # github.actor rules out a commit someone else pushed to a Dependabot branch.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
