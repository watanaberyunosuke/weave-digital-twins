# Checks every PR and every push to main, then merges Dependabot patch
# updates that pass. Minor and major updates stay open for review.
#
# Each component is installed on Python 3.12, the base of its Docker image,
# so a dependency bump that breaks an import fails here rather than at
# container start (setuptools 83 did, HDH-134).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m py_compile gis/*.py ingest/*.py scripts/seed_synthetic_network.py model/*.py console/app.py
      - run: bash -n scripts/*.sh
      - run: node --check console/static/app.js

  component:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [model, ingest, console]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.txt
      - run: pip install -r requirements.txt
      # The EPANET test skips when wntr can't be imported, so import it
      # explicitly: a broken wntr must fail the build, not skip a test.
      - if: matrix.component == 'model'
        run: |
          python -c "import wntr, run_sim"
          python -m unittest discover -s . -p 'test_*.py'
      - if: matrix.component == 'ingest'
        run: python -c "import common, hydrometry_poller, market_poller"
      - if: matrix.component == 'console'
        run: python -c "import app"

  dependabot-merge:
    name: Merge Dependabot patch update
    needs: [syntax, component]
    # github.actor rules out a commit someone else pushed to a Dependabot branch.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
