# Dependabot version updates for the Python images. Each folder below has its
# own requirements.txt and is built into its own container.
#
# The model has no ignores since wntr 1.5.0 (HDH-144): it needs numpy 2 and
# no longer imports pkg_resources, so the numpy<2 and setuptools<82 limits
# for wntr 1.3.2 are gone. Dependabot bumps one package at a time, so a wntr
# release that raises its numpy floor fails the model job's install until
# numpy is moved with it.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/model"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/ingest"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/console"
    schedule:
      interval: "weekly"

  # The workflows pin actions to commit SHAs; this keeps those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
